<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fruit Trades</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#080b14;color:#fff;display:grid;place-items:center}.app{width:min(460px,92vw);padding:30px;border:1px solid #27314a;border-radius:24px;background:#121827;box-shadow:0 24px 70px #0008}.logo{font-weight:900;letter-spacing:.08em;color:#91a0ff}.hero{text-align:center;margin:12px 0 25px}h1{margin:8px 0;font-size:32px}.muted{color:#9ca8c4;line-height:1.5}.prize{margin:20px 0;padding:18px;text-align:center;border-radius:16px;background:#201c3c;border:1px solid #443b70}.prize strong{display:block;font-size:21px;margin:5px}label{display:block;margin:15px 0 7px;font-size:13px;color:#cbd3e8}input{width:100%;padding:14px;border-radius:12px;border:1px solid #303a56;background:#0c111e;color:#fff;font-size:16px;outline:0}input:focus{border-color:#7180ff}button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:#6978ff;color:#fff;font-weight:800;cursor:pointer}.admin{display:none;margin-top:25px;padding-top:22px;border-top:1px solid #27314a}.entry{padding:15px;border-radius:14px;background:#0c111e;border:1px solid #303a56}.actions{display:flex;gap:10px}.actions button{flex:1}.reject{background:#394154}.msg{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#0c111e;border:1px solid #303a56}.tiny{text-align:center;color:#727e99;font-size:11px;margin-top:15px}
</style></head>
<body><main class="app"><div class="logo">FRUIT TRADES</div><section><div class="hero"><h1>100K Giveaway</h1><div class="muted">Giveaway della community dedicato a Blox Fruits.</div></div><div class="prize">PREMIO<strong>Perm Buddha</strong><span>Blox Fruits</span></div><label>Nome utente Roblox</label><input id="user" placeholder="Il tuo username Roblox" autocomplete="off"><label>Codice personale</label><input id="code" placeholder="Scegli un codice" autocomplete="off"><button id="send">PARTECIPA</button><div id="msg" class="msg"></div><div class="tiny">Non inserire password o credenziali Roblox.</div></section><section id="admin" class="admin"><h2>Pannello organizzatore</h2><div class="muted">Amministratore: dynamitron50@gmail.com</div><div class="entry"><p>Username: <b id="ou"></b></p><p>Codice: <b id="oc"></b></p><p>Stato: <b id="st">IN ATTESA</b></p><div class="actions"><button id="ok">APPROVA</button><button id="no" class="reject">RIFIUTA</button></div></div></section></main>
<script>
const $=id=>document.getElementById(id);const msg=(t)=>{$('msg').style.display='block';$('msg').textContent=t};
$('send').onclick=()=>{let u=$('user').value.trim(),c=$('code').value.trim();if(!u||!c)return msg('Inserisci username e codice.');$('ou').textContent=u;$('oc').textContent=c;$('admin').style.display='block';msg('Partecipazione ricevuta. In attesa di verifica.');$('admin').scrollIntoView({behavior:'smooth'})};
$('ok').onclick=()=>{$('st').textContent='APPROVATA';msg('🎉 Partecipazione approvata! Riceverai informazioni sul giveaway.')};$('no').onclick=()=>{$('st').textContent='RIFIUTATA';msg('Partecipazione rifiutata. Nessuna ricompensa.')};
</script></body></html>
